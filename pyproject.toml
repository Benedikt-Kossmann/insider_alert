[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insider_alert"
version = "0.1.0"
description = "Insider-Activity Detection Bot"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "arch>=6.0",
    "transformers>=4.35",
    "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
